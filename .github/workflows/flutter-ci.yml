name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=clawd_studio --org=dev.clawdstudio .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: One-time format cleanup for initial branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/flutter-foundation-and-ci'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart
            git commit -m "Format Flutter source (GPT-6)"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clawd-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
