name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=clawd_studio --org=dev.clawdstudio .
          fi
      - name: Configure native Termux bridge
        run: python3 tool/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: |
          dart format .
          dart format --set-exit-if-changed .
      - name: One-time formatter commit
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- lib/main.dart test/termux_engine_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart test/termux_engine_test.dart
            git commit -m "style: format Termux bridge sources"
            git push
          fi
      - name: Check diff whitespace
        run: git diff --check
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clawd-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
